[project]
name = "nasa-mars-rag"
version = "0.1.0"
description = "Production-Ready RAG system for NASA Mars technical reports with hybrid retrieval, reranking, citations, and Ragas evaluation."
authors = [{ name = "Engineer" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "google-genai>=0.1.1",
    "ragas>=0.2.0",
    "pandas>=2.0.0",
    "datasets>=2.19.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
